  else if(e.target.dataset&&e.target.dataset.note)LS.s("note_"+e.target.dataset.note,e.target.value);
});
function go(i){cur=i;history.replaceState(null,"","#t"+i);render(true);scrollTo({top:0})}
document.addEventListener("click",e=>{
  const t=e.target.closest("#tabs button");if(t)return go(+t.dataset.i);
  const g=e.target.closest(".go");
  if(g){const k=tabs.findIndex(x=>tr(x.title).replace(/\s/g,"")===g.dataset.go.replace(/\s/g,""));if(k>=0)go(k);return}
  const h=e.target.closest("button.hd");if(h)(h.closest(".grp,.it,.card")||h.closest("li")).classList.toggle("open");
});
let lastSt=["off","กำลังโหลด…"];function status(c,txt){lastSt=[c,txt];const s=$("#st");s.className=c;s.querySelector("span").textContent=tr(txt)}
const trim=r=>{while(r.length&&!r[r.length-1].length)r.pop();return r};
const toTabs=p=>p.sheets.map(s=>({title:s.properties.title,rows:trim((s.data||[]).flatMap(d=>d.rowData||[]).map(r=>trim((r.values||[]).map(c=>c.formattedValue||""))))}));

const m=/^#t(\d+)$/.exec(location.hash);if(m&&SNAP[+m[1]])cur=+m[1];
render(true);
status("off","ข้อมูลสำรอง");
setInterval(tick,1000);wxLoad();setInterval(wxLoad,36e5);
(function(){
  const sel=$("#langsel");sel.value=LG;
  sel.addEventListener("change",()=>{
    LG=sel.value;try{localStorage.setItem("lang",LG)}catch(e){}
    render(false);status(lastSt[0],lastSt[1]);
  });
  status(lastSt[0],lastSt[1]);
})();
(async()=>{
  let mcp=null;
  try{mcp=window.claude&&await window.claude.use("mcp")}catch(e){}
  if(!mcp){status("off","ข้อมูลสำรอง · เปิดผ่าน claude.ai เพื่อดูข้อมูลสด");return}
  mcp.watchTool("Google Sheets","get_spreadsheet",{spreadsheetId:SHEET,includeGridData:true,fields:["sheets.properties.title","sheets.data.rowData.values.formattedValue"]},ev=>{
    if(ev.type==="error"){
      const c=ev.error&&ev.error.code;
      status("off",["needs_reauth","server_not_connected","approval_required","not_granted","blocked_by_policy"].includes(c)?"ยังไม่ได้เชื่อม Google Sheets ใน claude.ai · แสดงข้อมูลสำรอง":"เชื่อมต่อไม่ได้ชั่วคราว · แสดงข้อมูลล่าสุดที่มี");
      return;
    }
    const p=ev.result.payload;if(!p||!Array.isArray(p.sheets))return;
    const nt=toTabs(p),s=JSON.stringify(nt),at=ev.result.cache&&ev.result.cache.storedAt;
    status("live","ข้อมูลสด · อัปเดต "+new Date(at||Date.now()).toLocaleTimeString("th-TH",{hour:"2-digit",minute:"2-digit"}));
    if(s!==sig){sig=s;tabs=withT(nt);if(cur>=tabs.length)cur=0;render(false)}
  },{refetchInterval:30000});
})();
</script>
